name: Generate three review-only drafts
on:
  schedule:
    - cron: '17 0 * * *' # 09:17 JST; GitHub may delay scheduled runs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-drafts
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Switch to review branch (or create it)
        run: |
          git fetch origin ai-drafts:refs/remotes/origin/ai-drafts || true
          if git show-ref --verify --quiet refs/remotes/origin/ai-drafts; then
            git switch -C ai-drafts origin/ai-drafts
          else
            git switch -c ai-drafts
          fi
      - name: Generate unapproved drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          run: python .github/workflows/generate.py 
      - name: Commit drafts only to a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drafts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add unapproved AI drafts'
          git push origin ai-drafts
